<!doctype html>
<html><head><meta charset="utf-8"><title>kite</title>
<meta name="color-scheme" content="dark">
<style>
  html,body { margin:0; height:100%; background:#0b0e11; color:#c2cad4;
    font:13px/1.65 {{FONT}}; }
  main { max-width: 62ch; padding: 12vh 6vw; }
  h1 { font-size: 15px; font-weight: 700; color:#8fbf8f; margin:0 0 2px; letter-spacing:.02em; }
  p.sub { margin:0 0 26px; color:#5b6675; }
  table { border-collapse: collapse; }
  td { padding: 1px 0; vertical-align: top; }
  td.k { width: 12ch; color:#dfe5ec; }
  td.a { color:#5b6675; }
  .hint { margin-top: 26px; color:#414b57; }
  .hint b { color:#626e7d; font-weight:400; }
</style></head>
<body><main>
  <h1>kite {{VERSION}}</h1>
  <p class="sub">a keyboard-first browser on the Chromium engine</p>
  <table>
    <tr><td class="k">o</td><td class="a">open a URL, search, or pick a bookmark</td></tr>
    <tr><td class="k">t / d</td><td class="a">new window / close it</td></tr>
    <tr><td class="k">f</td><td class="a">follow a link by hint label</td></tr>
    <tr><td class="k">/</td><td class="a">find in page</td></tr>
    <tr><td class="k">u</td><td class="a">reopen the last closed window</td></tr>
    <tr><td class="k">?</td><td class="a">every key binding</td></tr>
    <tr><td class="k">:</td><td class="a">commands</td></tr>
  </table>
  <p class="hint">press <b>o</b> to go somewhere, or <b>?</b> to see the keys.</p>
</main></body></html>
