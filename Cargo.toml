[package]
name = "kite"
version = "0.1.0"
edition = "2021"
description = "A keyboard-first, Chromium-engine browser shell built for slow machines"
license = "MIT"

[[bin]]
name = "kite"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
base64 = "0.22"
